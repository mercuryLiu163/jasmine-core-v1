[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jasmine-core"
version = "0.1.0"
description = "Jasmine Core V1 baseline: immutable raw event store and truth foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
context = ["tiktoken==0.14.0"]

[project.scripts]
jasmine-core = "jasmine_core.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
