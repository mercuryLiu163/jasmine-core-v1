name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    # P0 depends on nothing but the standard library, so a clean runner can
    # reproduce the acceptance runs without installing anything (ADR 0001 §2.1).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"

      - name: Migration smoke run from an empty database
        env:
          PYTHONPATH: src
        run: |
          set -x
          export JASMINE_CORE_DB="$RUNNER_TEMP/core.db"
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli schema

      - name: Test suite
        env:
          PYTHON: python
        run: ./scripts/run-tests.sh

      - name: Verify no runtime data was committed
        run: |
          set -x
          test -z "$(git ls-files | grep -E '\.(db|sqlite|token)$' || true)"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No runtime database, token or credential is tracked
        run: |
          set -x
          leaked="$(git ls-files \
            | grep -E '\.(db|db3|sqlite|sqlite3|token|env|pem|key|p12|pfx)$' \
            | grep -vE '\.(py|md)$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::tracked runtime/credential files: $leaked"
            exit 1
          fi
      - name: Migration checksums match what the code ships
        env:
          PYTHONPATH: src
        run: |
          set -x
          # Fails if a released migration was edited in place, or if the
          # recorded checksum and the shipped SQL have diverged.
          export JASMINE_CORE_DB="$RUNNER_TEMP/checksum.db"
          rm -f "$JASMINE_CORE_DB"*
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli schema
          python - <<'PY'
          import json, os, sqlite3
          from jasmine_core.migrations import discover
          recorded = {
              row[0]: row[1]
              for row in sqlite3.connect(os.environ["JASMINE_CORE_DB"]).execute(
                  "SELECT name, checksum FROM schema_migrations"
              )
          }
          shipped = {m.name: m.checksum for m in discover()}
          assert recorded == shipped, f"checksum mismatch: {recorded} != {shipped}"
          print(json.dumps(shipped, indent=2))
          PY
