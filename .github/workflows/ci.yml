name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    # P0 depends on nothing but the standard library, so a clean runner can
    # reproduce the acceptance runs without installing anything (ADR 0001 §2.1).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite3', sqlite3.sqlite_version)"

      - name: Serve the API and probe it end to end
        env:
          PYTHONPATH: src
        run: |
          set -x
          export JASMINE_CORE_DB="$RUNNER_TEMP/api.db"
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli serve --port 8799 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8799/v1/health && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8799/v1/health
          curl -sf http://127.0.0.1:8799/v1/meta/schema
          # An unauthenticated write must be refused and must not reach Truth.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8799/v1/projects -H 'Content-Type: application/json' \
            -d '{"name":"x","host_id":"hst_01K742SG00BMSDET9BTP151RAR"}')
          test "$status" = 401

      - name: Migration smoke run from an empty database
        env:
          PYTHONPATH: src
        run: |
          set -x
          export JASMINE_CORE_DB="$RUNNER_TEMP/core.db"
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli schema

      - name: Diagnose macOS listener ownership tools
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys
          child = subprocess.Popen([sys.executable, '-u', '-c',
              'import socket,sys; s=socket.socket(); s.bind(("127.0.0.1",0)); '
              's.listen(); print(s.getsockname()[1],flush=True); sys.stdin.readline()'],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          try:
              port = int(child.stdout.readline())
              print('listener uid/pid/port:', os.getuid(), child.pid, port, flush=True)
              candidates = list(dict.fromkeys([shutil.which('lsof'), '/usr/sbin/lsof']))
              for binary in candidates:
                  if not binary or not pathlib.Path(binary).exists():
                      continue
                  version = subprocess.run([binary, '-v'], capture_output=True, text=True, timeout=10)
                  print('lsof binary:', binary, 'version:', (version.stdout + version.stderr)[:1500], flush=True)
                  for flags in ([f'-iTCP:{port}', '-sTCP:LISTEN'],
                                [f'-iTCP:{port}'],
                                ['-a', '-p', str(child.pid), f'-iTCP:{port}']):
                      command = [binary, '-nP', *flags, '-t']
                      result = subprocess.run(command, capture_output=True, text=True, timeout=10)
                      pids = sorted({int(line) for line in result.stdout.splitlines() if line.isdecimal()})
                      print('probe:', command, 'returncode:', result.returncode,
                            'pids:', pids, 'diagnostic:', result.stderr[:1500], flush=True)
          finally:
              child.stdin.close()
              try:
                  child.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  child.terminate()
                  try:
                      child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      child.wait(timeout=5)
          PY

      - name: Test suite
        env:
          PYTHON: python
        run: ./scripts/run-tests.sh

      - name: The acceptance runner executes and reports BLOCKED, not PASS
        env:
          PYTHON: python
        run: |
          set -x
          # P0-T07 needs a real Codex conversation, which CI does not have, so
          # the expected outcome is BLOCKED. The point of this step is that the
          # runner preserves BLOCKED as a distinct exit code and verdict.
          set +e
          python3 scripts/p0-acceptance.py \
            --out "$RUNNER_TEMP/acceptance" --db "$RUNNER_TEMP/acceptance.db"
          code=$?
          set -e
          # 2 means the real-conversation case is BLOCKED in CI.
          test "$code" = 2
          python3 -c "
          import glob, json, sys
          path = sorted(glob.glob('$RUNNER_TEMP/acceptance/run-*.json'))[-1]
          run = json.load(open(path))
          assert run['verdict'] == 'BLOCKED', run['verdict']
          verdicts = {c['case_id']: c['verdict'] for c in run['cases']}
          print(json.dumps(verdicts, indent=2))
          expected = {f'P0-T{i:02d}': 'PASS' for i in range(1, 7)}
          expected['P0-T07'] = 'BLOCKED'
          assert verdicts == expected, verdicts
          "

      - name: Preserve P0 acceptance verdict and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/acceptance/
          if-no-files-found: warn

      - name: P1 component acceptance T01 through T09
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/p1-acceptance.py \
            --out "$RUNNER_TEMP/p1-components" --work "$RUNNER_TEMP/p1-work"
          python3 - <<'PY'
          import glob, json, os
          path = glob.glob(os.environ['RUNNER_TEMP'] + '/p1-components/p1-components-*.json')
          assert len(path) == 1, path
          run = json.load(open(path[0]))
          assert run['verdict'] == 'PASS', run
          assert {c['case_id']: c['verdict'] for c in run['cases']} == {
              f'P1-T{i:02d}': 'PASS' for i in range(1, 10)}, run
          assert run['coverage']['real_hook_and_user_conversation'] == 'P1-T10_not_run_here'
          PY

      - name: P1 real Codex Gate is explicitly BLOCKED in CI
        env:
          PYTHONPATH: src
        run: |
          mkdir -p "$RUNNER_TEMP/p1-real"
          set +e
          python3 scripts/p1-real-conversation.py --run --out "$RUNNER_TEMP/p1-real"
          code=$?
          set -e
          test "$code" = 2
          python3 - <<'PY'
          import glob, json, os
          paths = glob.glob(os.environ['RUNNER_TEMP'] + '/p1-real/p1-t10-run-*.json')
          assert len(paths) == 1, paths
          run = json.load(open(paths[0]))
          assert run['case_id'] == 'P1-T10' and run['verdict'] == 'BLOCKED', run
          assert run['phase'] == 'preflight', run
          PY

      - name: Preserve P1 acceptance records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/p1-components/
            ${{ runner.temp }}/p1-real/
          if-no-files-found: warn

      - name: Verify no runtime data was committed
        run: |
          set -x
          test -z "$(git ls-files | grep -E '\.(db|sqlite|token)$' || true)"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No runtime database, token or credential is tracked
        run: |
          set -x
          leaked="$(git ls-files \
            | grep -E '\.(db|db3|sqlite|sqlite3|token|env|pem|key|p12|pfx)$' \
            | grep -vE '\.(py|md)$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::tracked runtime/credential files: $leaked"
            exit 1
          fi
      - name: Migration checksums match what the code ships
        env:
          PYTHONPATH: src
        run: |
          set -x
          # Fails if a released migration was edited in place, or if the
          # recorded checksum and the shipped SQL have diverged.
          export JASMINE_CORE_DB="$RUNNER_TEMP/checksum.db"
          rm -f "$JASMINE_CORE_DB"*
          python -m jasmine_core.cli migrate
          python -m jasmine_core.cli schema
          python - <<'PY'
          import json, os, sqlite3
          from jasmine_core.migrations import discover
          recorded = {
              row[0]: row[1]
              for row in sqlite3.connect(os.environ["JASMINE_CORE_DB"]).execute(
                  "SELECT name, checksum FROM schema_migrations"
              )
          }
          shipped = {m.name: m.checksum for m in discover()}
          assert recorded == shipped, f"checksum mismatch: {recorded} != {shipped}"
          print(json.dumps(shipped, indent=2))
          PY
